<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100"> 
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand fs-6 fw-bold" href="../index.html"><span class="d-inline-flex align-items-center justify-content-center 
             bg-success rounded text-white me-1"style="width: 25px; height: 25px"><i class="bi bi-currency-dollar"></i>
            </span>Controle Financeiro</a>
        <!-- Botão hamburger -->
        <button
          class="navbar-toggler border-2"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <!--Opções Menu-->
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto fs-6 fw-bold">
            <li class="nav-item">
              <a class="nav-link" href="../index.html"><i class="bi bi-house-door-fill me-1"></i>Início</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="lancamentos.html"><i class="bi bi-list-ul me-1"></i>Lançamentos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="categorias.html"><i class="bi bi-tags me-1"></i>Categorias</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contas.html"><i class="bi bi-wallet2 me-1"></i>Contas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="relatorio.html"><i class="bi-bar-chart-line me-1"></i>Relatório</a>
            </li>            
          </ul>
        </div>
      </div>
    </nav>
    
    <div class="container mt-3 flex-grow-1 py-4">
        <div class="row">
            <div class="d-flex align-items-center justify-content-between">
                <div>
                  <div class="d-flex col-auto align-items-center me-5">
                    <i class="bi bi-wallet2 fs-2 me-1"></i>
                    <h2 class="fw-bold mb-0">Contas</h2>     
                  </div>  
                  <p class="text-secondary mb-0">Gerencie suas contas e os saldos respectivos</p>            
                </div>                
                <div>
                    <button class="btn btn-success" id="btnNovaConta"><i class="bi bi-plus"></i>Nova Conta</button>
                </div>
            </div>                
        </div>

  <!-- CONTAS SÃO INSERIDAS NESTA DIV. DEIXAR VAZIA -->
  <div class="row mt-4" id="listaContas"></div>

        <div class="modal fade" id="modalCadastrarConta" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                  <form id="formConta">
                      <div class="modal-header">
                          <h5 class="modal-title">Cadastrar Conta</h5>
                          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                      </div>
                      <div class="modal-body">
                          <input type="hidden" id="contaId">
                          <div class="mb-3">
                              <label class="form-label">Nome</label>
                              <input id="contaNome" class="form-control" placeholder="Ex.: Conta corrente" required>
                          </div>
                          <div class="mb-3">
                              <label class="form-label">Tipo</label>
                              <select id="contaTipo" class="form-select" required>
                                  <option value="corrente">Conta corrente</option>
                                  <option value="poupanca">Poupança</option>
                                  <option value="carteira">Carteira</option>
                                  <option value="cartao">Investimento</option>                                  
                                  <option value="outro">Outro</option>
                              </select>
                          </div>
                          <!-- CORTADO PARA QUE O SALDO INICIAL SEJA INCLUÍDO POR LANÇAMENTO
                          <div>
                              <label class="form-label">Saldo inicial (R$)</label>
                              <input id="contaSaldoInicial" type="number" class="form-control" step="0.01" min="0.01" placeholder="0.00" required>
                          </div>    -->              
                      </div>
                      <div class="modal-footer">
                          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                          <button type="submit" class="btn btn-primary">Salvar</button>
                      </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark mt-auto">
        <div class="container text-center py-2">
            <small class="footer-text">
                <h5 class="mb-1">Projeto Integrador III</h5>
                <h6 class="mb-1">Polo: Picada Café</h6>
                <h6 class="mb-1">Alunos: José Henrique Silveira, Plínio Moraes e Paulo Floriani</h6>
            </small>
        </div>
    </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
