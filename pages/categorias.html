<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand fs-6 fw-bold" href="../index.html"><span class="d-inline-flex align-items-center justify-content-center 
             bg-success rounded text-white me-1"style="width: 25px; height: 25px"><i class="bi bi-currency-dollar"></i>
            </span>Controle Financeiro</a>
        <!-- Botão hamburger -->
        <button
          class="navbar-toggler border-2"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <!--Opções Menu-->
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto fs-6 fw-bold">
            <li class="nav-item">
              <a class="nav-link" href="../index.html"><i class="bi bi-house-door-fill me-1"></i>Início</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="lancamentos.html"><i class="bi bi-list-ul me-1"></i>Lançamentos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="categorias.html"><i class="bi bi-tags me-1"></i>Categorias</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contas.html"><i class="bi bi-wallet2 me-1"></i>Contas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="relatorio.html"><i class="bi-bar-chart-line me-1"></i>Relatório</a>
            </li>            
          </ul>
        </div>
      </div>
    </nav>
    <main class="container py-4">
        <div class="container mt-3 flex-grow-1">
            <div class="row">
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div>
                    <div class="d-flex col-auto align-items-center me-5">
                        <i class="bi bi-tags fs-2 me-1"></i>
                        <h2 class="fw-bold mb-0">Categorias</h2>     
                    </div>  
                    <p class="text-secondary mb-0">Organize as receitas e despesas por categoria.</p>            
                    </div>                
                    <div>
                        <button class="btn btn-success" id="btnNovaCategoria"><i class="bi bi-plus"></i>Nova Categoria</button>
                    </div>
                </div>                
            </div>
        </div>
        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card h-100">
                    <div class="card-header bg-white pt-4 px-4">
                        <h2 class="h5 mb-0 text-primary fw-bold">Receitas</h2>
                    </div>
                    <div class="card-body px-4">
                        <div id="listaCategoriasReceitas"></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card h-100">
                    <div class="card-header bg-white pt-4 px-4">
                        <h2 class="h5 mb-0 text-danger fw-bold">Despesas</h2>
                    </div>
                    <div class="card-body px-4">
                        <div id="listaCategoriasDespesas"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modalCategoria" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="formCategorias">
                    <div class="modal-header">
                          <h5 class="modal-title">Cadastrar Categoria</h5>
                          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                      </div>
                      <div class="modal-body"> 
                        <input type="hidden" id="categoriaId">
                        <div class="mb-3">
                            <label class="form-label">Nome</label>
                            <input id="categoriaNome" class="form-control" required>
                        </div>
                        <div>
                            <label class="form-label">Tipo</label>
                            <select id="categoriaTipo" class="form-select" required>
                                <option value="receita">Receita</option>
                                <option value="despesa">Despesa</option>
                            </select>
                        </div>
                      </div>
                      <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button class="btn btn-success" type="submit">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
